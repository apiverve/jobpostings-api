openapi: 3.0.4
info:
  title: Job Postings
  description: >-
    Job Postings is a jobs API that returns the open positions on a company's
    public career board. Every job comes back in the same shape: title,
    department, team, locations, remote and workplace type, employment type,
    posting date and apply link. Filter by keyword, location, department,
    employment type, posting date or remote. Paid plans add the full job
    description and salary ranges where the company publishes them.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/jobpostings:
    get:
      summary: Job Postings
      description: >-
        Get the open jobs on a company's public job board, newest first, with
        optional filters.
      operationId: jobpostings
      parameters:
        - name: company
          in: query
          schema:
            type: string
          required: true
          description: >-
            The company's career board name, usually the company name in
            lowercase, for example airbnb, stripe or palantir. Required unless
            url is given.
          example: airbnb
        - name: keyword
          in: query
          schema:
            type: string
          required: false
          description: >-
            Return only jobs whose title, department or team contains every word
            given, for example engineer or product designer.
          example: engineer
        - name: location
          in: query
          schema:
            type: string
          required: false
          description: >-
            Return only jobs with a location containing this text, for example
            London, New York or Germany.
          example: New York
        - name: remote
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            true returns only jobs open to remote work; false only jobs that are
            not.
          example: true
        - name: department
          in: query
          schema:
            type: string
          required: false
          description: >-
            Return only jobs whose department or team contains this text, for
            example Engineering or Sales.
          example: Engineering
        - name: employmentType
          in: query
          schema:
            type: string
          required: false
          description: >-
            Return only jobs of this employment type. Jobs whose board gives no
            employment type are kept, since many boards leave it blank; only
            jobs of another type are left out.
          example: full-time
        - name: postedSince
          in: query
          schema:
            type: string
          required: false
          description: >-
            Return only jobs first published at or after this date or date-time
            (ISO 8601, for example 2026-10-01), or within this age: a number
            followed by h, d or w, for example 12h, 7d or 2w. Jobs with no
            posting date are left out when this is set.
          example: 7d
        - name: minSalary
          in: query
          schema:
            type: number
          required: false
          description: >-
            Return only jobs whose salary range reaches at least this amount, in
            the job's own currency and pay period: the top of the range is
            compared, or the bottom when no top is given. Jobs that publish no
            salary are left out when this is set.
          example: 100000
        - name: page
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Page of results to return: 10 jobs per page on the free plan, 50 on
            paid plans.
          example: 1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  company: Airbnb
                  boardTotal: 174
                  truncated: false
                  total: 174
                  page: 1
                  pages: 4
                  count: 2
                  jobs:
